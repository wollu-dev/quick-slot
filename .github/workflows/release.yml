name: Release

# Publishing a GitHub release (tag v1.2.0, say) pushes both images to the GitHub Container Registry:
#   ghcr.io/<owner>/quick-slot-web and ghcr.io/<owner>/quick-slot-api
# tagged 1.2.0, 1.2 and latest (pre-releases, with a "-" in the version, get only their own version).
# Merges to main publish nothing. "Run workflow" with a tag publishes that release again (e.g. after a failed run).
# Pull requests that change the images build them for both platforms without pushing, to catch breakage early.
#
# Each platform is built on its own native runner: emulating arm64 with QEMU is slow and can hang the site build.
# The per-platform images are pushed by digest and then joined into one multi-platform tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        required: true
  pull_request:
    paths:
      - Dockerfile
      - deploy/**
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: sign in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quick-slot-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.name.outputs.version }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: keep the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [web, api]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quick-slot-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=${{ !contains(env.TAG, '-') }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - name: join the platforms under the version tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }}"
