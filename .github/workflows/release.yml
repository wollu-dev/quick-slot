name: Release

# Publishing a GitHub release (tag v1.2.0, say) pushes both images to the GitHub Container Registry:
#   ghcr.io/<owner>/quick-slot-web and ghcr.io/<owner>/quick-slot-api
# tagged 1.2.0, 1.2 and latest (pre-releases get only their own version). Merges to main publish nothing.
# Pull requests that change the images build them for both platforms without pushing, to catch breakage early.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - deploy/**
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: sign in to ghcr.io
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quick-slot-${{ matrix.image }}
          flavor: latest=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
