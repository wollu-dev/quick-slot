# QuickSlot web: static files from the Astro build, /api passed to the api service.

# Access log without client addresses and without query strings (which can hold what users typed),
# as promised on the privacy page: time, method, path, status, size, duration
log_format quickslot '$time_iso8601 "$request_method $uri" $status $body_bytes_sent ${request_time}s';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log quickslot;

  # Uploads for server tools go to the API; keep the limit in line with what the API accepts
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
  # (nginx's default mime.types already serves .wasm as application/wasm, which streaming compilation needs)

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

  # Hashed build assets never change: cache them for a year
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  # pdf.js data files carry the pdf.js version in their path
  location /pdfjs/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long downloads (server tools) stream through instead of buffering on disk
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

}
