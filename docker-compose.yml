# Run QuickSlot with the published images:
#   SITE_URL is baked into the web image when it is built (see .github/workflows/release.yml),
#   so here you only pick the version and the port.
#
#   docker compose up -d
#
# To build the images locally instead, run `docker compose build` with SITE_URL set:
#   SITE_URL=https://example.com docker compose build

services:
  web:
    image: ghcr.io/wollu-dev/quick-slot-web:${QUICKSLOT_VERSION:-latest}
    build:
      context: .
      target: web
      args:
        SITE_URL: ${SITE_URL:-}
    ports:
      - "${QUICKSLOT_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/wollu-dev/quick-slot-api:${QUICKSLOT_VERSION:-latest}
    build:
      context: .
      target: api
    environment:
      TRUST_PROXY: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
      # Accounts (Pro features): start with COMPOSE_PROFILES=accounts and set POSTGRES_PASSWORD and AUTH_SECRET
      SITE_URL: ${SITE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
    # The API is reached only through nginx in the web container
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    # Video downloads are written here until they are sent, then deleted right away
    volumes:
      - video-work:/work
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Postgres for accounts. Only started with the "accounts" profile; then set
  # DATABASE_URL=postgres://quickslot:<POSTGRES_PASSWORD>@db:5432/quickslot
  db:
    image: postgres:18-alpine
    profiles: [accounts]
    environment:
      POSTGRES_USER: quickslot
      POSTGRES_DB: quickslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickslot -d quickslot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  video-work:
  db-data:
